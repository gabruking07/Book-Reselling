services:
  - type: web
    name: bookreselling
    env: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: book_reselling
      - key: NODE_VERSION
        value: 20
